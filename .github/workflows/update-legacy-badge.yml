name: Update legacy UPC+5 test badge

on:
  push:
    branches:
      - fix/legacy-upc5-book-scans
    paths:
      - .github/workflows/update-legacy-badge.yml

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/legacy-upc5-book-scans
          fetch-depth: 0

      - name: Update unit-test badge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'unit%20tests-2014%20passing-brightgreen'
          new = 'unit%20tests-2023%20passing-brightgreen'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old badge, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit badge and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-legacy-badge.yml
          git add README.md
          git diff --cached --check
          git commit -m "Update test-count badge"
          git push origin HEAD:fix/legacy-upc5-book-scans
