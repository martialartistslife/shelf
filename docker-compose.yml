services:
  shelf:
    build: .
    container_name: ${SHELF_CONTAINER:-shelf-dev}
    network_mode: host
    environment:
      - CERT_SAN=${CERT_SAN:-DNS:localhost}
      - SHELF_PORT=${SHELF_PORT:-18889}
      - SHELF_TRUST_PROXY=${SHELF_TRUST_PROXY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - SHELF_ENCRYPTION_KEY=${SHELF_ENCRYPTION_KEY:-}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN:-}
      - METADATA_PROVIDER_ORDER=${METADATA_PROVIDER_ORDER:-}
      - METADATA_CONNECT_TIMEOUT=${METADATA_CONNECT_TIMEOUT:-}
      - METADATA_READ_TIMEOUT=${METADATA_READ_TIMEOUT:-}
      - METADATA_WRITE_TIMEOUT=${METADATA_WRITE_TIMEOUT:-}
      - METADATA_POOL_TIMEOUT=${METADATA_POOL_TIMEOUT:-}
      - COVER_CONNECT_TIMEOUT=${COVER_CONNECT_TIMEOUT:-}
      - COVER_READ_TIMEOUT=${COVER_READ_TIMEOUT:-}
      - COVER_WRITE_TIMEOUT=${COVER_WRITE_TIMEOUT:-}
      - COVER_POOL_TIMEOUT=${COVER_POOL_TIMEOUT:-}
      - OPENLIBRARY_CONTACT=${OPENLIBRARY_CONTACT:-}
    volumes:
      - ${SHELF_DATA:-./data-dev}:/data:z
    restart: unless-stopped
